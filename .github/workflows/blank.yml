name: CI
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        os:
          - windows-2025      # x86_64
          - windows-11-arm    # aarch64
          - ubuntu-24.04      # x86_64
          - ubuntu-24.04-arm  # aarch64
          - macos-15-intel    # x86_64
          - macos-26          # aarch64
        qt_ver:
          - 6.10.0
          # should fail on Windows before merging PR #1000.
          - 6.11.0
          - 6.11.1
          - 6.11.2
        iqta_setup_py: ['true', 'false']
        aqtsource: 
          - ''  # defaults to v3.3.0
          - 'git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e'  # fixes Qt 6.11 on Windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Python
        if: ${{ matrix.iqta_setup_py == 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_ver }}
          setup-python: ${{ matrix.iqta_setup_py }}
          aqtsource: ${{ matrix.aqtsource }}
